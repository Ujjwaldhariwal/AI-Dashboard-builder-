name: Release Readiness

on:
  push:
    branches:
      - main
      - dev
      - 'codex/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Build, contracts, and security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_EMAIL_DOMAIN: company.com
      BOSCH_PROXY_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: API inventory
        run: npm run api-docs:check
      - name: Start deterministic acceptance server
        shell: bash
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > next-test.log 2>&1 &
          echo $! > next-test.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat next-test.log
          exit 1
      - name: Deterministic acceptance
        run: npx playwright test tests --workers=1
      - name: Stop deterministic acceptance server
        if: always()
        shell: bash
        run: |
          if [ -f next-test.pid ]; then
            kill "$(cat next-test.pid)" || true
          fi
      - name: Upload deterministic server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-server-log
          path: next-test.log
          if-no-files-found: ignore
      - name: Production build
        run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  live-acceptance:
    name: Live Supabase DB and authenticated E2E
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_EMAIL_DOMAIN: ${{ vars.NEXT_PUBLIC_EMAIL_DOMAIN || 'company.com' }}
      DASHBOARDOS_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Require live acceptance secrets
        shell: bash
        run: |
          missing=()
          for name in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_ACCESS_TOKEN \
            UPSTASH_REDIS_REST_URL \
            UPSTASH_REDIS_REST_TOKEN
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required live acceptance secret: %s\n' "${missing[@]}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Migration history reconciliation gate
        run: npm run db:migrations:check
      - name: Chart refinement RPC compatibility gate
        run: npm run db:chart-refinement-rpc:check
      - name: Redis connectivity gate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.UPSTASH_REDIS_REST_URL.replace(/\/$/, '')
          const response = await fetch(`${base}/pipeline`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.UPSTASH_REDIS_REST_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify([
              ['INCR', `dashboardos:ci:${process.env.GITHUB_RUN_ID}`],
              ['PEXPIRE', `dashboardos:ci:${process.env.GITHUB_RUN_ID}`, '60000'],
            ]),
          })
          if (!response.ok) throw new Error(`Redis connectivity failed (${response.status})`)
          const results = await response.json()
          if (!Array.isArray(results) || results.some(result => result?.error)) {
            throw new Error('Redis connectivity returned a command error')
          }
          NODE
      - name: Route-handler DB acceptance
        env:
          DASHBOARDOS_INTEGRATION_SUPABASE: '1'
        run: npx playwright test tests/guided-publish-db-integration.spec.ts tests/chart-refinement-db-integration.spec.ts --workers=1
      - name: Build production server
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > next-live-acceptance.log 2>&1 &
          echo $! > next-live-acceptance.pid
          node -e "const u='http://127.0.0.1:3000/login';const s=Date.now();(async function w(){try{const r=await fetch(u);if(r.status<500)process.exit(0)}catch{}if(Date.now()-s>60000)process.exit(1);setTimeout(w,1000)})()"
      - name: Authenticated HTTP acceptance
        env:
          DASHBOARDOS_INTEGRATION_SUPABASE: '1'
          DASHBOARDOS_LIVE_HTTP_GUIDED_PUBLISH: '1'
        run: npx playwright test e2e/guided-publish-live-auth.spec.ts --workers=1
      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f next-live-acceptance.pid ]; then
            kill "$(cat next-live-acceptance.pid)" || true
          fi
      - name: Upload live server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-live-server
          path: next-live-acceptance.log
          if-no-files-found: ignore
